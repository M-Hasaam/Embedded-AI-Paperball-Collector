<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="720" fill="#ffffff"/>

  <text x="450" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#111">Servo supply monitor: two 3-to-1 voltage dividers to GPIO 9 and GPIO 10</text>
  <text x="450" y="58" font-size="13" text-anchor="middle" fill="#555">This only taps each servo supply: the servos keep their normal power wires. The board is drawn symbolically; use the real GPIO 9 and GPIO 10 header pins.</text>

  <!-- ===================== ESP32-S3 ===================== -->
  <rect x="330" y="150" width="240" height="300" rx="10" fill="#eef3fb" stroke="#1f3a68" stroke-width="2.5"/>
  <text x="450" y="205" font-size="20" font-weight="700" text-anchor="middle" fill="#1f3a68">ESP32-S3</text>
  <text x="450" y="228" font-size="12" text-anchor="middle" fill="#456">AI_Car board</text>
  <text x="450" y="365" font-size="13" text-anchor="middle" fill="#456">reads the two rail voltages</text>
  <text x="450" y="385" font-size="13" text-anchor="middle" fill="#456">(slows or stops the servos</text>
  <text x="450" y="405" font-size="13" text-anchor="middle" fill="#456">when a rail sags)</text>
  <!-- pins -->
  <circle cx="330" cy="290" r="6" fill="#1565c0"/>
  <text x="344" y="294" font-size="14" font-weight="700" fill="#1565c0">GPIO 9</text>
  <text x="344" y="314" font-size="11" fill="#1565c0">about 1.8 V</text>
  <circle cx="570" cy="290" r="6" fill="#1565c0"/>
  <text x="556" y="294" font-size="14" font-weight="700" text-anchor="end" fill="#1565c0">GPIO 10</text>
  <text x="556" y="314" font-size="11" text-anchor="end" fill="#1565c0">about 1.7 V</text>
  <circle cx="450" cy="450" r="6" fill="#222"/>
  <text x="450" y="438" font-size="14" font-weight="700" text-anchor="middle" fill="#222">GND</text>

  <!-- ===================== LEFT: MG996R rail -> GPIO 9 ===================== -->
  <rect x="40" y="78" width="200" height="46" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="140" y="98" font-size="13" font-weight="700" text-anchor="middle" fill="#8e1b1b">MG996R rail (+)</text>
  <text x="140" y="115" font-size="12" text-anchor="middle" fill="#8e1b1b">XL4015 output, about 5.5 V</text>
  <line x1="240" y1="101" x2="288" y2="101" stroke="#c62828" stroke-width="2.5"/>
  <polygon points="288,95 300,101 288,107" fill="#c62828"/>
  <text x="246" y="90" font-size="11" fill="#8e1b1b">to elbow + shoulder</text>
  <text x="246" y="124" font-size="11" fill="#8e1b1b">servos (unchanged)</text>
  <line x1="140" y1="124" x2="140" y2="140" stroke="#c62828" stroke-width="2.5"/>
  <!-- R1a + R1b in series -->
  <rect x="127" y="140" width="26" height="50" rx="3" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="165" y="170" font-size="13" font-weight="700" fill="#111">R1a 9.76 kΩ</text>
  <line x1="140" y1="190" x2="140" y2="200" stroke="#333" stroke-width="2.5"/>
  <rect x="127" y="200" width="26" height="50" rx="3" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="165" y="230" font-size="13" font-weight="700" fill="#111">R1b 9.76 kΩ</text>
  <line x1="140" y1="250" x2="140" y2="290" stroke="#333" stroke-width="2.5"/>
  <!-- node -->
  <circle cx="140" cy="290" r="6" fill="#1565c0"/>
  <line x1="140" y1="290" x2="330" y2="290" stroke="#1565c0" stroke-width="3"/>
  <text x="170" y="280" font-size="12" fill="#1565c0">to GPIO 9</text>
  <!-- R2 -->
  <line x1="140" y1="290" x2="140" y2="330" stroke="#333" stroke-width="2.5"/>
  <rect x="127" y="330" width="26" height="60" rx="3" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="165" y="365" font-size="13" font-weight="700" fill="#111">R2 9.76 kΩ</text>
  <line x1="140" y1="390" x2="140" y2="560" stroke="#333" stroke-width="2.5"/>
  <!-- capacitor 100 nF -->
  <circle cx="250" cy="290" r="4" fill="#1565c0"/>
  <line x1="250" y1="290" x2="250" y2="450" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="232" y1="450" x2="268" y2="450" stroke="#333" stroke-width="3"/>
  <line x1="232" y1="464" x2="268" y2="464" stroke="#333" stroke-width="3"/>
  <line x1="250" y1="464" x2="250" y2="560" stroke="#333" stroke-width="2.5"/>
  <text x="224" y="462" font-size="12" text-anchor="end" fill="#111">100 nF (104)</text>

  <!-- ===================== RIGHT: SG90 rail -> GPIO 10 ===================== -->
  <rect x="660" y="78" width="200" height="46" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="760" y="98" font-size="13" font-weight="700" text-anchor="middle" fill="#8e1b1b">SG90 rail (+)</text>
  <text x="760" y="115" font-size="12" text-anchor="middle" fill="#8e1b1b">its own buck, about 5.0 to 5.2 V</text>
  <line x1="660" y1="101" x2="612" y2="101" stroke="#c62828" stroke-width="2.5"/>
  <polygon points="612,95 600,101 612,107" fill="#c62828"/>
  <text x="654" y="90" font-size="11" text-anchor="end" fill="#8e1b1b">to the gripper</text>
  <text x="654" y="124" font-size="11" text-anchor="end" fill="#8e1b1b">servo (unchanged)</text>
  <line x1="760" y1="124" x2="760" y2="140" stroke="#c62828" stroke-width="2.5"/>
  <rect x="747" y="140" width="26" height="50" rx="3" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="735" y="170" font-size="13" font-weight="700" text-anchor="end" fill="#111">R1a 9.76 kΩ</text>
  <line x1="760" y1="190" x2="760" y2="200" stroke="#333" stroke-width="2.5"/>
  <rect x="747" y="200" width="26" height="50" rx="3" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="735" y="230" font-size="13" font-weight="700" text-anchor="end" fill="#111">R1b 9.76 kΩ</text>
  <line x1="760" y1="250" x2="760" y2="290" stroke="#333" stroke-width="2.5"/>
  <circle cx="760" cy="290" r="6" fill="#1565c0"/>
  <line x1="760" y1="290" x2="570" y2="290" stroke="#1565c0" stroke-width="3"/>
  <text x="730" y="280" font-size="12" text-anchor="end" fill="#1565c0">to GPIO 10</text>
  <line x1="760" y1="290" x2="760" y2="330" stroke="#333" stroke-width="2.5"/>
  <rect x="747" y="330" width="26" height="60" rx="3" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="735" y="365" font-size="13" font-weight="700" text-anchor="end" fill="#111">R2 9.76 kΩ</text>
  <line x1="760" y1="390" x2="760" y2="560" stroke="#333" stroke-width="2.5"/>
  <circle cx="650" cy="290" r="4" fill="#1565c0"/>
  <line x1="650" y1="290" x2="650" y2="450" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="632" y1="450" x2="668" y2="450" stroke="#333" stroke-width="3"/>
  <line x1="632" y1="464" x2="668" y2="464" stroke="#333" stroke-width="3"/>
  <line x1="650" y1="464" x2="650" y2="560" stroke="#333" stroke-width="2.5"/>
  <text x="676" y="462" font-size="12" fill="#111">100 nF (104)</text>

  <!-- ===================== COMMON GND ===================== -->
  <line x1="120" y1="560" x2="780" y2="560" stroke="#222" stroke-width="4"/>
  <line x1="450" y1="456" x2="450" y2="560" stroke="#222" stroke-width="2.5"/>
  <circle cx="450" cy="560" r="5" fill="#222"/>
  <circle cx="140" cy="560" r="5" fill="#222"/>
  <circle cx="760" cy="560" r="5" fill="#222"/>
  <text x="450" y="584" font-size="14" font-weight="700" text-anchor="middle" fill="#222">COMMON GND</text>
  <text x="450" y="602" font-size="12" text-anchor="middle" fill="#555">converter outputs (-), the S3 GND pin and the servos' ground wires, joined with short thick wires</text>

  <!-- ===================== NOTES ===================== -->
  <rect x="40" y="620" width="820" height="88" rx="8" fill="#fffbe6" stroke="#e0b100" stroke-width="1.5"/>
  <text x="56" y="641" font-size="12.5" fill="#222"><tspan font-weight="700">Take the + from the converter's output terminals</tspan> (the same point the servos' red wires use), so the divider reads the real rail voltage.</text>
  <text x="56" y="659" font-size="12.5" fill="#222"><tspan font-weight="700">Ratio 3 to 1:</tspan> the top is TWO resistors in series, the bottom is ONE. All three must be the same value (yours: 9.76 kΩ).</text>
  <text x="56" y="677" font-size="12.5" fill="#222"><tspan font-weight="700">A 5.5 V rail gives about 1.8 V at the pin,</tspan> the middle of the S3's accurate range. Keep the pin below 3.1 V.</text>
  <text x="56" y="695" font-size="12.5" fill="#222"><tspan font-weight="700">Join the S3 GND to each converter's (-) terminal</tspan> with a short thick wire, so the servo current cannot shift the S3's ground.</text>
</svg>
